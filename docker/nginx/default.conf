server {
    listen 80;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # ACME and other standards-based verification files remain available.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # Do not expose dotfiles, VCS metadata, or application source directories.
    location ~ /\.(?!well-known) {
        deny all;
        log_not_found off;
    }

    location ~* ^/(?:src|config|database|bootstrap|routes|vendor|node_modules|storage|tests)(?:/|$) {
        deny all;
        log_not_found off;
    }

    # Only the public front controller may be executed by PHP-FPM.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass app:9000;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    # Vite build assets are content-hashed and can be cached for a year.
    location ^~ /build/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # User-facing static assets use a shorter cache lifetime.
    location ~* \.(?:avif|css|eot|gif|ico|jpe?g|js|png|svg|ttf|webp|woff2?)(?:\?.*)?$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
