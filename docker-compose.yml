services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-blog}
      DB_USERNAME: ${DB_USERNAME:-blog}
      DB_PASSWORD: ${DB_PASSWORD:-blog}
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-blog}
      POSTGRES_USER: ${DB_USERNAME:-blog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-blog}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USERNAME:-blog} -d $${DB_DATABASE:-blog}"]
      interval: 5s
      timeout: 5s
      retries: 20
  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html

volumes:
  postgres_data:
